<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRON LOG — Aggiornamento</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#09090b;color:#fff;display:grid;place-items:center;height:100vh;margin:0;text-align:center}main{max-width:340px;padding:28px}button{background:#d5a64a;border:0;border-radius:14px;padding:14px 20px;font-weight:700;font-size:16px}p{color:#aaa;line-height:1.5}</style><main><h1>IRON LOG</h1><p>Sto aggiornando il motore dell'app per correggere la compatibilità con Safari.</p><button id="b">Aggiorna IRON LOG</button><p id="s"></p></main><script>const s=document.getElementById('s');async function go(){if(!('serviceWorker'in navigator)){s.textContent='Service Worker non disponibile.';return}try{const r=await navigator.serviceWorker.register('./sw-v7.js',{scope:'./',updateViaCache:'none'});await r.update();s.textContent='Aggiornamento installato. Apri ora IRON LOG.';setTimeout(()=>location.href='./',1200)}catch(e){s.textContent='Riprova tra qualche secondo.'}}document.getElementById('b').onclick=go;go();</script>
